services:
  app:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      db2:
        condition: service_healthy
    environment:
      DB2_HOST: db2
      DB2_PORT: "50000"
      DB2_DATABASE: HOSPITAL
      DB2_USER: db2inst1
      DB2_PASSWORD: senha123
      ANEXOS_DIR: /app/anexos
      ADMIN_SENHA_INICIAL: TrocarSenha@2026
    volumes:
      - anexos-data:/app/anexos

  db2:
    image: icr.io/db2_community/db2:11.5.9.0
    privileged: true
    environment:
      LICENSE: accept
      DB2INST1_PASSWORD: senha123
      DBNAME: HOSPITAL
    ports:
      - "50000:50000"
    volumes:
      - db2-data:/database
    healthcheck:
      test: ["CMD", "su", "-", "db2inst1", "-c", "db2 connect to HOSPITAL"]
      interval: 30s
      timeout: 20s
      # Em máquinas com pouca RAM livre a criação da instância DB2 fica bem mais
      # lenta que o padrão do container (swap em vez de RAM), então a janela de
      # tolerância antes de marcar unhealthy foi ampliada.
      retries: 40
      start_period: 20m

volumes:
  db2-data:
  anexos-data:
